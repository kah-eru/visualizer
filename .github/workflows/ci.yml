name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
    inputs:
      publish-artifact:
        type: boolean
        default: false
    secrets:
      VITE_WEB3FORMS_KEY:
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # Publish exactly the bundle the browser tests exercised.
      - uses: actions/upload-pages-artifact@v3
        if: inputs.publish-artifact
        with:
          path: dist
